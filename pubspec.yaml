name: ekaplus_ekatunggal
description: "Eka+ Ekatunggal Mobile Application"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+2

environment:
  sdk: ^3.9.0

dependencies:
  animated_text_kit: ^4.3.0
  auto_size_text: ^3.0.0
  bloc: ^9.1.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.1
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dropdown_button2: ^2.3.9
  easy_localization: ^3.0.8
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_secure_storage: ^10.0.0
  font_awesome_flutter: ^10.12.0
  get: ^4.7.2
  get_it: ^9.0.1
  go_router: ^16.3.0
  google_sign_in: ^7.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.5.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  photo_view: ^0.15.0
  pin_code_fields: ^8.0.1
  share_plus: ^12.0.1
  shared_preferences: ^2.5.4
  shimmer: ^3.0.0
  socket_io_client: ^3.1.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/images/avatars/
    - assets/images/account/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
    - family: Lato
      fonts:
        - asset: assets/fonts/lato/Lato-Regular.ttf
        - asset: assets/fonts/lato/Lato-Bold.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon_app.png"
